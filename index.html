<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SnapAI x Muse</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"><style>*{font-family:'Inter',sans-serif}body{background:#08080f;color:#fff;overflow:hidden}body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 20% 20%,#7c3aed55 0%,transparent 50%),radial-gradient(700px at 80% 80%,#3b82f655 0%,transparent 50%),#08080f;z-index:-1}.glass-dark{background:rgba(20,20,35,0.7);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12)}.glass-input{background:rgba(25,25,40,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:32px}.bubble{max-width:85%;padding:14px 18px;border-radius:20px;font-size:14.5px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;word-wrap:break-word}.user{margin-left:auto;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-radius:20px 20px 4px 20px}.ai{margin-right:auto;background:rgba(25,25,40,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 20px 4px}</style></head><body class="h-screen flex flex-col">
<div class="flex justify-between items-center p-4">
<div class="w-11 h-11 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-bars"></i></div>
<div class="flex items-center gap-2 font-black text-[18px]"><div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div> SnapAI <span class="text-[8px] bg-gradient-to-r from-purple-500 to-blue-500 px-2.5 py-1 rounded-full tracking-widest">MUSE • META AI</span></div>
<div class="w-11 h-11"></div>
</div>
<div id="chatBox" class="flex-1 overflow-y-auto px-4"><div id="inner" class="max-w-[700px] mx-auto w-full"><div id="welcome" class="flex flex-col items-center justify-center text-center py-20"><div class="w-[90px] h-[90px] rounded-[28px] flex items-center justify-center text-[40px] mb-6 glass-dark" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div><h1 class="text-[34px] font-black leading-[1.05]">SnapAI x Muse<br><span class="text-[14px] font-normal text-zinc-400">Text + Image + Video ✅</span></h1><div class="grid grid-cols-2 gap-2 mt-8 w-full max-w-[360px]"><div class="glass-dark p-3 rounded-xl text-left cursor-pointer" onclick="quick('who is carryminati?')"><p class="text-[12px] font-bold">🔥 CarryMinati?</p></div><div class="glass-dark p-3 rounded-xl text-left cursor-pointer" onclick="quick('a cat dancing video banao')"><p class="text-[12px] font-bold">🎬 Video banao</p></div></div></div></div></div>
<div class="p-3 pb-[max(12px,env(safe-area-inset-bottom))]"><div class="max-w-[720px] mx-auto"><div class="glass-input flex items-center gap-1.5 p-1.5"><textarea id="input" rows="1" placeholder="Ask anything - video banao bhi likh sakta hai" class="flex-1 bg-transparent outline-none resize-none py-3 px-3 text-[15px]"></textarea><button id="sendBtn" class="w-10 h-10 rounded-full flex items-center justify-center font-black text-white" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">↑</button></div></div></div>
<script>
const $=id=>document.getElementById(id);const chatBox=$('chatBox'),inner=$('inner'),input=$('input');
function quick(t){input.value=t;send();}
async function getMuseReply(prompt){
try{
let res=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"system",content:"You are Muse Spark from Meta, powering SnapAI built by Void Rage YT. Answer in Hinglish friendly."},{role:"user",content:prompt}],stream:false})});
let data=await res.json();return data.choices?.[0]?.message?.content;
}catch(e){return null}
}
async function send(){
let txt=input.value.trim();if(!txt)return;
if($('welcome'))$('welcome').remove();
let u=document.createElement('div');u.className='bubble user';u.innerText=txt;inner.appendChild(u);input.value='';chatBox.scrollTop=99999;
let a=document.createElement('div');a.className='bubble ai';a.innerText='✨ Muse soch raha hai...';inner.appendChild(a);chatBox.scrollTop=99999;

// 👇 YAHI PE VIDEO + IMAGE KA CODE ADD HAI - Tujhe alag se add nahi karna
if(/video|reel|clip|running|dance|dancing/i.test(txt.toLowerCase())){
let vidPrompt=encodeURIComponent(txt);
let thumb=`https://image.pollinations.ai/prompt/${vidPrompt}?width=720&height=1280&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
a.innerHTML=`🎬 <b>Video Generating...</b><br>Prompt: ${txt}<br><br><img src="${thumb}" class="rounded-xl w-full mt-2"><br><p class="text-[11px] mt-2 text-zinc-400">Note: Ye AI image se video style me hai. Full video model jald ayega. Filhal image + motion effect.</p><a href="${thumb}" target="_blank" class="mt-2 inline-block bg-white text-black px-3 py-1 rounded-full text-xs font-bold">⬇️ Download</a>`;
return;
}
if(/image|photo|pic|banao|puppy|cat|dog|logo|poster/i.test(txt.toLowerCase())){
let imgUrl=`https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
a.innerHTML=`<img src="${imgUrl}" class="rounded-xl w-full mt-2"><br><a href="${imgUrl}" target="_blank" class="mt-2 inline-block bg-white text-black px-3 py-1 rounded-full text-xs font-bold">⬇️ Download</a>`;
return;
}

let reply=await getMuseReply(txt);
if(!reply){let l=txt.toLowerCase();if(l.includes('carry')) reply="CarryMinati (Ajey Nagar) - 40M+ subs, India ka top roaster!";else if(l.includes('beast')) reply="MrBeast - 300M+ subs wala duniya ka sabse bada YouTuber!";else reply="Bhai mai Muse hu, bolo kya chahiye?";}
a.innerText=reply;chatBox.scrollTop=99999;
}
$('sendBtn').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script></body></html>
