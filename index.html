<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapAI - Free Forever</title>
<style>
body{background:#080808;color:#fff;font-family:system-ui;text-align:center;margin:0;padding:15px}
h1{color:#00FF88;text-shadow:0 0 15px #00FF88}
.card{background:#151515;border:1px solid #222;border-radius:16px;padding:18px;max-width:420px;margin:20px auto}
.input-box{display:flex;gap:8px;background:#1e1e1e;border-radius:10px;padding:8px;border:1px solid #333}
input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:15px}
#micBtn{background:#222;border:none;color:#00FF88;font-size:20px;border-radius:50%;width:40px;height:40px}
.btn-main{width:100%;background:#00FF88;color:#000;font-weight:800;padding:14px;border:none;border-radius:10px;margin-top:15px;font-size:16px}
#result img{width:100%;border-radius:12px;border:1px solid #00FF88;margin-top:10px}
</style>
</head>
<body>
<h1>SnapAI - FREE</h1>
<p>Diwali Poster - Bol ke Banao</p>
<div class="card">
<div class="input-box">
<input id="prompt" type="text" placeholder="Ex: Diwali poster for Sharma Sweets">
<button id="micBtn" onclick="startMic()">🎤</button>
</div>
<button class="btn-main" onclick="gen()">Generate Poster ✨</button>
<div id="result" style="margin-top:20px"></div>
</div>
<script>
function startMic(){
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!SR){alert('Chrome me kholo');return;}
 let r=new SR(); r.lang='hi-IN'; r.start();
 r.onresult=e=>{document.getElementById('prompt').value=e.results[0][0].transcript;}
}
function gen(){
 let p=document.getElementById('prompt').value||'Diwali Poster';
 document.getElementById('result').innerHTML=`<p>Ban gaya: ${p}</p><img src="https://dummyimage.com/512x512/101010/00FF88&text=${p.replace(/ /g,'+')}"><br><br><a href="https://dummyimage.com/512x512/101010/00FF88&text=${p.replace(/ /g,'+')}" download><button class="btn-main" style="background:#222;color:white">Download ⬇️</button></a>`;
}
</script>
</body>
</html>
