<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GANGSTER CRIME CITY 7.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
body{background:#000;color:#fff;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}

/* ===== LOADING ===== */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#intro.hide{opacity:0;pointer-events:none;transition:1s}
#bg{position:absolute;inset:0}
#center{z-index:2;text-align:center}
#logo{font-size:56px;line-height:.9;letter-spacing:7px;animation:glow 1.6s infinite alternate}
@keyframes glow{0%{color:#fff;text-shadow:0 0 15px #8b5cf6,0 0 40px #8b5cf6;transform:scale(1)}100%{color:#e9d5ff;text-shadow:0 0 25px #fff,0 0 70px #00d4ff,0 0 110px #8b5cf6;transform:scale(1.06)}}
#tag{color:#a78bfa;font-size:11px;letter-spacing:5px;margin-top:6px}
#bar{width:340px;height:12px;background:rgba(255,255,255,.07);border:1px solid rgba(139,92,246,.4);border-radius:20px;margin:22px auto 0;overflow:hidden}
#fill{width:0%;height:100%;background:linear-gradient(90deg,#8b5cf6,#00d4ff,#fff,#8b5cf6);background-size:300% 100%;animation:shift 1s linear infinite}
@keyframes shift{0%{background-position:0%}100%{background-position:300%}}
#per{margin-top:10px;font-size:11px;color:#888;letter-spacing:2px}

/* ===== MENU ===== */
#menu{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 30% 50%,#1e123f,#000);display:none;align-items:center;justify-content:center;flex-direction:column}
#menu.show{display:flex}
.btn{width:310px;padding:15px;margin:8px;border-radius:14px;border:none;color:#fff;font-size:14px;cursor:pointer}
.btn.main{background:linear-gradient(90deg,#8b5cf6,#00d4ff);box-shadow:0 0 30px #8b5cf6}
.btn.sec{background:#111;border:2px solid #333}
</style></head><body>

<div id="intro"><canvas id="bg"></canvas>
<div id="center">
<div id="logo">GANGSTER<br>CRIME CITY</div>
<div id="tag">VOID RAGE YT PRESENTS</div>
<div id="bar"><div id="fill"></div></div>
<div id="per">LOADING ULTRA WORLD... 0%</div>
</div>
</div>

<div id="menu">
<div style="font-size:50px;line-height:.9;text-align:center;text-shadow:0 0 30px #8b5cf6">GANGSTER<br>CRIME CITY</div>
<div style="color:#8b5cf6;letter-spacing:4px;font-size:10px;margin:12px 0 22px">v7.0 • FINAL • NO ROTATE • NO BOAT TEXT</div>
<button class="btn main" onclick="start()">▶ PLAY ULTRA WORLD</button>
</div>

<canvas id="game"></canvas>

<script>
// ===== ANIMATED BG - PARTICLES =====
const bg=document.getElementById('bg'), bx=bg.getContext('2d');
function rsz(){bg.width=innerWidth; bg.height=innerHeight} rsz();
let dots=[]; for(let i=0;i<70;i++) dots.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.5+1,s:Math.random()*1+0.4});
(function anim(){
bx.fillStyle='rgba(0,0,0,0.25)'; bx.fillRect(0,0,bg.width,bg.height);
let g=bx.createRadialGradient(bg.width/2,bg.height/2,0,bg.width/2,bg.height/2,bg.width);
g.addColorStop(0,'rgba(139,92,246,0.18)'); g.addColorStop(1,'rgba(0,0,0,0)'); bx.fillStyle=g; bx.fillRect(0,0,bg.width,bg.height);
dots.forEach(d=>{d.y-=d.s; if(d.y<0){d.y=bg.height; d.x=Math.random()*bg.width;} bx.fillStyle='#a78bfa'; bx.shadowColor='#8b5cf6'; bx.shadowBlur=10; bx.beginPath(); bx.arc(d.x,d.y,d.r,0,6.28); bx.fill(); bx.shadowBlur=0;});
requestAnimationFrame(anim);
})();

// ===== LOADING - CLEAN, NO BOAT TEXT =====
const fill=document.getElementById('fill'), per=document.getElementById('per'), intro=document.getElementById('intro'), menu=document.getElementById('menu');
let p=0; let iv=setInterval(()=>{p+=Math.random()*12+8; if(p>100)p=100; fill.style.width=p+'%'; per.innerText=`LOADING ULTRA WORLD... ${Math.floor(p)}%`; if(p>=100){clearInterval(iv); setTimeout(()=>{intro.classList.add('hide'); menu.classList.add('show');},700);}},130);
setTimeout(()=>{intro.classList.add('hide'); menu.classList.add('show');},4800);

// ===== NO COPYRIGHT SOUND - SELF MADE =====
let actx;
function sound(){
try{
if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
let o=actx.createOscillator(), g=actx.createGain(); o.type='sine';
o.frequency.setValueAtTime(200,actx.currentTime); o.frequency.linearRampToValueAtTime(800,actx.currentTime+0.4);
g.gain.setValueAtTime(0.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.5);
o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.5);
}catch(e){}
}
document.addEventListener('click',sound,{once:true}); document.addEventListener('touchstart',sound,{once:true});

function start(){sound(); intro.classList.add('hide'); menu.classList.remove('show'); initGame();}

// ===== MAIN GAME - NO ROTATE SYSTEM =====
const c=document.getElementById('game'), ctx=c.getContext('2d');
function rs(){c.width=innerWidth; c.height=innerHeight} rs(); window.onresize=rs;
let player={x:0,y:0}, boats=[];
function initGame(){
rs();
for(let i=0;i<300;i++) boats.push({x:(Math.random()-0.5)*8000,y:(Math.random()-0.5)*8000,a:Math.random()*6.28});
loop();
}
function loop(){
// sky
let sky=ctx.createLinearGradient(0,0,0,c.height); sky.addColorStop(0,'#07051a'); sky.addColorStop(0.6,'#1a1033'); sky.addColorStop(1,'#ff9a6b');
ctx.fillStyle=sky; ctx.fillRect(0,0,c.width,c.height);
// sea
ctx.fillStyle='#0a3a5a'; ctx.fillRect(c.width/2-4000-player.x,c.height/2-3000-player.y,8000,6000);
// boats
boats.forEach(b=>{
let sx=b.x+c.width/2-player.x, sy=b.y+c.height/2-player.y;
if(sx>-50&&sx<c.width+50&&sy>-50&&sy<c.height+50){
ctx.save(); ctx.translate(sx,sy); ctx.rotate(b.a); ctx.fillStyle='#5de2ff'; ctx.fillRect(-18,-7,36,14); ctx.restore();
}
});
// player
ctx.fillStyle='#8b5cf6'; ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=18; ctx.beginPath(); ctx.arc(c.width/2,c.height/2,13,0,6.28); ctx.fill(); ctx.shadowBlur=0;
requestAnimationFrame(loop);
}
</script></body></html>
