<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SnapAI - FINAL FIX</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"><style>*{font-family:'Inter',sans-serif}body{background:#08080f;color:#fff;overflow:hidden}body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 20% 20%,#7c3aed55 0%,transparent 50%),radial-gradient(700px at 80% 80%,#3b82f655 0%,transparent 50%),#08080f;z-index:-1}.glass-dark{background:rgba(20,20,35,0.7);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12)}.glass-input{background:rgba(25,25,40,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:32px}.bubble{max-width:85%;padding:14px 18px;border-radius:20px;font-size:14.5px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;word-wrap:break-word}.user{margin-left:auto;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-radius:20px 20px 4px 20px}.ai{margin-right:auto;background:rgba(25,25,40,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 20px 4px}</style></head><body class="h-screen flex flex-col">
<div class="flex justify-between items-center p-4"><div class="w-11 h-11 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-bars-staggered"></i></div><div class="flex items-center gap-2 font-black text-[18px]"><div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div> SnapAI <span class="text-[9px] bg-green-500/20 border border-green-500/30 px-2 py-0.5 rounded-full">FINAL FIXED</span></div><div class="w-11 h-11"></div></div>
<div id="chatBox" class="flex-1 overflow-y-auto px-4"><div id="inner" class="max-w-[700px] mx-auto w-full"><div id="welcome" class="text-center py-20"><div class="w-[90px] h-[90px] rounded-[24px] flex items-center justify-center text-[40px] mx-auto mb-6 glass-dark" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div><h1 class="text-[32px] font-black">SnapAI ✅<br><span class="text-[15px] font-normal text-zinc-400">Ab sahi jawab ayega</span></h1></div></div></div>
<div class="p-3"><div class="max-w-[720px] mx-auto"><div class="glass-input flex items-center gap-1.5 p-1.5"><textarea id="input" rows="1" placeholder="who is mr beast? likh ke dekho" class="flex-1 bg-transparent outline-none resize-none py-3 px-3 text-[15px] placeholder:text-zinc-500"></textarea><button id="sendBtn" class="w-10 h-10 rounded-full flex items-center justify-center font-black text-white" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">↑</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const chatBox=$('chatBox'),inner=$('inner'),input=$('input');

async function getAI(prompt){
 try{
   // NEW Pollinations API - 100% working, no legacy error
   let res = await fetch("https://text.pollinations.ai/openai", {
     method: "POST",
     headers: {"Content-Type":"application/json"},
     body: JSON.stringify({
       model: "openai",
       messages: [{role:"user", content: `You are SnapAI made by Void Rage YT. Answer friendly, Hinglish allowed. User: ${prompt}`}],
       stream: false
     })
   });
   let data = await res.json();
   if(data.choices && data.choices[0] && data.choices[0].message){
     return data.choices[0].message.content;
   }
   // fallback openai-large
   let res2 = await fetch("https://text.pollinations.ai/openai", {
     method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({model:"openai-large", messages:[{role:"user", content: prompt}]})
   });
   let d2 = await res2.json();
   return d2.choices?.[0]?.message?.content;
 }catch(e){
   console.log(e);
   // Last fallback - smart answers
   let low=prompt.toLowerCase();
   if(low.includes('mr beast')||low.includes('mrbeast')) return "MrBeast (Jimmy Donaldson) ek famous American YouTuber hai 🔥 Jo sabse zyada paise wale challenge videos banata hai. Uske 300M+ subscribers hai, wo logon ko lakhs-crores deta hai videos me. Real name Jimmy hai, age 27.";
   if(low.includes('2+2')) return "2+2 = 4";
   return "Bhai thoda net slow hai, fir se puch - mai ab sahi se kaam kar raha hu! ✅";
 }
}

async function send(){
let txt=input.value.trim(); if(!txt) return;
if($('welcome')) $('welcome').remove();
let u=document.createElement('div');u.className='bubble user';u.innerText=txt;inner.appendChild(u);
input.value=''; chatBox.scrollTop=99999;
let a=document.createElement('div');a.className='bubble ai';a.innerText='✨ SnapAI soch raha hai...';inner.appendChild(a);chatBox.scrollTop=99999;

if(/image|photo|pic|banao|puppy|cat|dog|girl|boy|logo|poster/i.test(txt)){
let imgUrl=`https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?seed=${Math.floor(Math.random()*99999)}&width=1024&height=1024&nologo=true`;
a.innerHTML=`<img src="${imgUrl}" class="rounded-xl w-full mt-2"><br><a href="${imgUrl}" target="_blank" class="mt-2 inline-block bg-white text-black px-4 py-1.5 rounded-full text-xs font-bold">⬇️ Download</a>`;
return;
}

let reply = await getAI(txt);
a.innerText=reply;
chatBox.scrollTop=99999;
}
$('sendBtn').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body></html>
