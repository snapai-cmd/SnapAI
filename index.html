<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:#ececec}
#sidebar{transform:translateX(-100%);transition:0.3s}
#sidebar.open{transform:translateX(0)}
</style>
</head>
<body class="h-screen flex flex-col">

<div class="flex justify-between items-center p-4 bg-[#0a0a0a] border-b border-zinc-800">
<button onclick="toggleSidebar()" class="text-xl">☰</button>
<p class="font-bold tracking-wide">SnapAI</p>
<button onclick="newChat()" class="w-8 h-8 rounded-full border border-zinc-700 flex items-center justify-center">+</button>
</div>

<div id="sidebar" class="fixed inset-0 z-50 flex">
<div class="w-72 bg-[#111] p-4 flex flex-col">
<div class="flex justify-between items-center mb-6"><h2 class="font-bold">Chats</h2><button onclick="toggleSidebar()">✕</button></div>
<button onclick="newChat()" class="w-full bg-white text-black font-bold py-3 rounded-full mb-4">+ New Chat</button>
<div id="historyList" class="flex-1 overflow-y-auto space-y-2 text-sm text-zinc-400">Koi history nahi</div>
</div>
<div class="flex-1 bg-black/60" onclick="toggleSidebar()"></div>
</div>

<div id="chatContainer" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
<h1 class="text-2xl font-bold">Kya banana hai?</h1>
<p class="text-zinc-500 text-sm mt-2 text-center max-w-[280px]">Jo chahe likho - "ek cute cat ki photo", "mere shop ka logo", "ek ladki ki painting" - AI wahi banayega.</p>
</div>

<div class="p-3 bg-[#0a0a0a] border-t border-zinc-800">
<div id="previewArea" class="hidden mb-2"></div>
<div class="flex items-end gap-2 bg-[#1e1e1e] rounded-[28px] p-2 border border-zinc-700">
<button onclick="document.getElementById('fileInput').click()" class="w-9 h-9 rounded-full bg-zinc-800 flex items-center justify-center flex-shrink-0">+</button>
<input type="file" id="fileInput" hidden accept="image/*" onchange="handleFile(this)">
<textarea id="userInput" rows="1" placeholder="Jo chahe likho..." class="flex-1 bg-transparent outline-none resize-none py-2.5 px-1 text-[15px]"></textarea>
<button onclick="startVoice()" class="w-9 h-9 rounded-full bg-zinc-800 flex items-center justify-center flex-shrink-0">🎤</button>
<button onclick="sendMessage()" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center font-bold flex-shrink-0">↑</button>
</div>
</div>

<script>
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function newChat(){document.getElementById('chatContainer').innerHTML=`<h1 class=text-2xl font-bold>Kya banana hai?</h1><p class="text-zinc-500 text-sm mt-2 text-center max-w-[280px]">Jo chahe likho - AI wahi banayega.</p>`}

let currentFile=null;
function handleFile(input){
let file=input.files[0]; if(!file) return; currentFile=file;
let prev=document.getElementById('previewArea'); prev.classList.remove('hidden');
prev.innerHTML=`<div class="bg-zinc-800 px-3 py-1 rounded-full text-xs inline-flex">📎 ${file.name} <span onclick="clearFile()" class="ml-2 cursor-pointer">x</span></div>`;
}
function clearFile(){currentFile=null; document.getElementById('previewArea').classList.add('hidden')}

function startVoice(){
let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='hi-IN'; rec.start();
rec.onresult=(e)=>{document.getElementById('userInput').value=e.results[0][0].transcript}
}

async function sendMessage(){
let input=document.getElementById('userInput');
let text=input.value.trim(); if(!text &&!currentFile) return;

let container=document.getElementById('chatContainer');
if(container.innerHTML.includes('Kya banana hai?')) container.innerHTML='';
container.classList.remove('justify-center','items-center');
container.classList.add('space-y-4','items-stretch');

let userDiv=document.createElement('div');
userDiv.className="self-end bg-[#2f2f2f] px-4 py-2 rounded-2xl max-w-[85%] text-sm";
userDiv.innerText=text;
container.appendChild(userDiv);
input.value=''; clearFile();

let aiDiv=document.createElement('div');
aiDiv.className="self-start bg-[#1a1a1a] border border-zinc-800 px-4 py-3 rounded-2xl max-w-[90%] text-sm";
aiDiv.innerHTML="Bana raha hu... ⏳";
container.appendChild(aiDiv);
container.scrollTop=container.scrollHeight;

// ALWAYS GENERATE IMAGE FOR ANY PROMPT
let imgUrl=`https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=768&height=768&seed=${Math.floor(Math.random()*10000)}&nologo=true`;
aiDiv.innerHTML=`Tumne bola: <b>${text}</b><br><br><img src="${imgUrl}" class="rounded-xl mt-2 w-full" onload="this.scrollIntoView()"><br><br><a href="${imgUrl}" download target="_blank" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold inline-block mt-2">Download Photo</a>`;

}
</script>
</body>
</html>
