<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SnapAI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://js.puter.com/v2/"></script><style>*{font-family:'Inter',sans-serif}body{background:#08080f;color:#fff;overflow:hidden}body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 20% 20%,#7c3aed55 0%,transparent 50%),radial-gradient(700px at 80% 80%,#3b82f655 0%,transparent 50%),#08080f;z-index:-1}.glass-dark{background:rgba(20,20,35,0.6);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12)}.glass-input{background:rgba(25,25,40,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:32px}.sidebar{position:fixed;left:-340px;top:0;bottom:0;width:320px;background:rgba(10,10,18,0.92);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-right:1px solid rgba(255,255,255,0.1);z-index:70;transition:0.45s;display:flex;flex-direction:column}.sidebar.open{left:0}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);z-index:60;display:none}.overlay.active{display:block}.bubble{max-width:85%;padding:14px 18px;border-radius:20px;font-size:14.5px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;word-wrap:break-word;animation:pop 0.3s ease}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.user{margin-left:auto;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-radius:20px 20px 4px 20px}.ai{margin-right:auto;background:rgba(25,25,40,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 20px 4px}.login-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{width:100%;max-width:380px;background:rgba(20,20,35,0.85);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);border-radius:28px;padding:28px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.active{display:flex}</style></head><body class="h-screen flex flex-col">
<div id="loginModal" class="login-bg"><div class="login-card"><div class="text-center mb-6"><div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center text-2xl mb-3" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div><h2 class="text-[22px] font-black">Welcome back</h2><p class="text-zinc-400 text-[13px] mt-1">Sign in to continue</p></div><input id="email" type="email" placeholder="you@gmail.com" class="w-full glass-dark rounded-xl px-4 py-3 text-[14px] outline-none mb-3"><input id="nameIn" type="text" placeholder="Your Name" class="w-full glass-dark rounded-xl px-4 py-3 text-[14px] outline-none mb-4"><button onclick="doLogin()" class="w-full py-3 rounded-xl font-bold text-white mb-3" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">Sign in / Sign up</button><button onclick="doLogin()" class="w-full glass-dark rounded-xl py-3 text-[13px] font-bold flex items-center justify-center gap-2"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Continue with Google</button></div></div>
<div id="profileModal" class="modal-bg"><div class="login-card"><div class="flex justify-between items-center mb-5"><h2 class="font-black text-[18px]">Profile</h2><button onclick="$('profileModal').classList.remove('active')" class="w-8 h-8 glass-dark rounded-full"><i class="fa-solid fa-xmark"></i></button></div><div class="text-center"><label for="picIn"><img id="profilePicBig" src="https://i.pravatar.cc/200" class="w-24 h-24 rounded-full mx-auto mb-3 border-2 border-purple-500 object-cover"><p class="text-[11px] text-purple-400 mb-3">Change Photo</p></label><input type="file" id="picIn" hidden accept="image/*"><input id="profileNameEdit" class="w-full glass-dark rounded-xl px-4 py-2 text-center font-bold mb-2"><p id="profileEmailBig" class="text-[12px] text-zinc-400 mb-4"></p><button onclick="saveProfile()" class="w-full py-2.5 rounded-xl font-bold text-white mb-2" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">Save Changes</button><button onclick="logout()" class="w-full py-2 rounded-xl bg-white/5 text-[12px]">Logout</button></div></div></div>
<div id="reportModal" class="modal-bg"><div class="login-card"><div class="flex justify-between items-center mb-4"><h2 class="font-black">Report Issue</h2><button onclick="$('reportModal').classList.remove('active')" class="w-8 h-8 glass-dark rounded-full"><i class="fa-solid fa-xmark"></i></button></div><textarea id="issueText" placeholder="Kya problem hai?" class="w-full glass-dark rounded-xl p-3 h-28 text-[14px] outline-none mb-3"></textarea><button onclick="sendIssue()" class="w-full py-3 rounded-xl font-bold text-white" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">Send Report</button></div></div>
<div class="overlay" id="overlay"></div><div class="sidebar" id="sidebar"><div class="p-5 border-b border-white/10"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center font-black" id="avatarLetter">U</div><div><p class="font-bold text-[14px]" id="userName">user</p><p class="text-[11px] text-zinc-400" id="userEmail">user@gmail.com</p></div></div><button id="closeBtn" class="w-8 h-8 glass-dark rounded-full"><i class="fa-solid fa-xmark text-xs"></i></button></div><button onclick="newChat()" class="w-full mt-4 py-3 rounded-xl font-bold text-sm text-white" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">+ New Chat</button></div><div class="flex-1 overflow-hidden flex flex-col"><p class="px-5 pt-4 text-[11px] tracking-widest text-zinc-500 uppercase font-bold">HISTORY</p><div id="historyList" class="flex-1 overflow-y-auto px-3 py-3 space-y-2"></div></div><div class="p-4 border-t border-white/10"><div onclick="$('profileModal').classList.add('active')" class="flex items-center gap-3 glass-dark p-3 rounded-xl cursor-pointer"><img id="sidePic" src="https://i.pravatar.cc/100" class="w-9 h-9 rounded-full object-cover"><div class="flex-1"><p class="text-[13px] font-bold" id="bottomName">user</p><p class="text-[11px] text-zinc-400">Click to view profile</p></div><i class="fa-solid fa-pen text-[11px]"></i></div><div class="flex gap-2 mt-3"><button onclick="$('reportModal').classList.add('active')" class="flex-1 py-2 rounded-xl bg-white/5 text-[11px]"><i class="fa-solid fa-bug mr-1"></i> Report Issue</button><button onclick="if(confirm('Delete all?')){localStorage.removeItem('h');loadH()}" class="w-10 h-8 bg-white/5 rounded-xl"><i class="fa-solid fa-trash text-[11px]"></i></button></div></div></div>
<div class="flex justify-between items-center p-4"><button id="menuBtn" class="w-11 h-11 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-bars-staggered"></i></button><div class="flex items-center gap-2 font-black text-[18px]"><div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div> SnapAI <span class="text-[9px] bg-purple-500/20 border border-purple-500/30 px-2 py-0.5 rounded-full">GEMINI</span></div><div class="w-11 h-11"></div></div><div id="chatBox" class="flex-1 overflow-y-auto px-4"><div id="inner" class="max-w-[700px] mx-auto w-full h-full flex flex-col"><div id="welcome" class="flex-1 flex flex-col items-center justify-center text-center pb-20"><div class="w-[90px] h-[90px] rounded-[24px] flex items-center justify-center text-[40px] mb-6 glass-dark" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div><h1 class="text-[38px] font-black">Welcome to<br><span style="background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SnapAI</span></h1><p class="text-zinc-400 mt-3 text-[14px]">Your best friend • Old Look Restored</p></div></div></div><div class="p-3 pb-[max(12px,env(safe-area-inset-bottom))]"><div class="max-w-[720px] mx-auto"><div class="glass-input flex items-center gap-1.5 p-1.5"><textarea id="input" rows="1" placeholder="Ask anything..." class="flex-1 bg-transparent outline-none resize-none py-3 px-3 text-[15px] placeholder:text-zinc-500"></textarea><button id="sendBtn" class="w-10 h-10 rounded-full flex items-center justify-center font-black text-white" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">↑</button></div><p class="text-[10px] text-zinc-500 text-center mt-2.5">SnapAI • Old Glass Look • Owner: Void Rage YT</p></div></div><script>
const $=id=>document.getElementById(id);const sidebar=$('sidebar'),overlay=$('overlay'),chatBox=$('chatBox'),inner=$('inner'),input=$('input');
function checkLogin(){let u=localStorage.getItem('snap_user');let p=localStorage.getItem('snap_pic');if(!u){$('loginModal').style.display='flex'}else{$('loginModal').style.display='none';let d=JSON.parse(u);$('userName').innerText=d.name;$('userEmail').innerText=d.email;$('bottomName').innerText=d.name;$('profileEmailBig').innerText=d.email;$('profileNameEdit').value=d.name;$('avatarLetter').innerText=d.name[0].toUpperCase();if(p){$('sidePic').src=p;$('profilePicBig').src=p;}}}
function doLogin(){let e=$('email').value.trim()||'user@gmail.com';let n=$('nameIn').value.trim()||e.split('@')[0];if(!e.includes('@')){alert('Sahi email');return}localStorage.setItem('snap_user',JSON.stringify({email:e,name:n}));checkLogin()}function logout(){localStorage.removeItem('snap_user');location.reload()}checkLogin();
$('menuBtn').onclick=()=>{sidebar.classList.add('open');overlay.classList.add('active');loadH()};$('closeBtn').onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('active')};overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('active')}
function newChat(){inner.innerHTML=`<div id="welcome" class="flex-1 flex flex-col items-center justify-center text-center pb-20"><div class="w-[90px] h-[90px] rounded-[24px] flex items-center justify-center text-[40px] mb-6 glass-dark" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">◈</div><h1 class="text-[38px] font-black">Welcome to<br><span style="background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SnapAI</span></h1><p class="text-zinc-400 mt-3 text-[14px]">Your best friend • Old Look Restored</p></div>`;sidebar.classList.remove('open');overlay.classList.remove('active')}
function saveH(q){let h=JSON.parse(localStorage.getItem('h')||'[]');h.unshift({q});localStorage.setItem('h',JSON.stringify(h.slice(0,30)))}
function loadH(){let h=JSON.parse(localStorage.getItem('h')||'[]');$('historyList').innerHTML=h.length?h.map((x,i)=>`<div class="glass-dark p-3 rounded-xl flex justify-between items-center"><span class="truncate text-[13px] flex-1 hist" data-q="${x.q.replace(/"/g,'&quot;')}">${x.q}</span><button onclick="let h=JSON.parse(localStorage.getItem('h')||'[]');h.splice(${i},1);localStorage.setItem('h',JSON.stringify(h));loadH()" class="w-6 h-6 bg-white/10 rounded-full ml-2"><i class="fa-solid fa-xmark text-[10px]"></i></button></div>`).join(''):'<p class="text-xs text-zinc-500 px-2">No history</p>';document.querySelectorAll('.hist').forEach(e=>e.onclick=()=>{input.value=e.dataset.q;sidebar.classList.remove('open');overlay.classList.remove('active');send()})}
$('picIn').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{localStorage.setItem('snap_pic',ev.target.result);$('sidePic').src=ev.target.result;$('profilePicBig').src=ev.target.result};r.readAsDataURL(f)}
function saveProfile(){let d=JSON.parse(localStorage.getItem('snap_user'));let n=$('profileNameEdit').value.trim();if(!n)return;localStorage.setItem('snap_user',JSON.stringify({email:d.email,name:n}));checkLogin();$('profileModal').classList.remove('active');alert('Profile saved ✅')}
function sendIssue(){let t=$('issueText').value.trim();if(!t){alert('Issue likh');return}let issues=JSON.parse(localStorage.getItem('issues')||'[]');issues.push({text:t,time:new Date().toLocaleString(),user:JSON.parse(localStorage.getItem('snap_user')).email});localStorage.setItem('issues',JSON.stringify(issues));$('issueText').value='';$('reportModal').classList.remove('active');alert('Report sent to Void Rage YT ✅')}
async function send(){let txt=input.value.trim();if(!txt)return;if($('welcome'))$('welcome').remove();let u=document.createElement('div');u.className='bubble user';u.innerText=txt;inner.appendChild(u);input.value='';saveH(txt);chatBox.scrollTop=chatBox.scrollHeight;let low=txt.toLowerCase();if(low.includes('owner')||low.includes('malik')||low.includes('kisne banaya')){let a=document.createElement('div');a.className='bubble ai';a.innerHTML='<b>My owner is Void Rage YT 🔥</b>';inner.appendChild(a);return}let a=document.createElement('div');a.className='bubble ai';a.innerHTML='✨ Gemini soch raha hai...';inner.appendChild(a);let isImg=/photo|image|pic|banao|generate|draw|poster|logo/i.test(txt);if(isImg){let imgUrl=`https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?seed=${Math.floor(Math.random()*99999)}&width=1024&height=1024&nologo=true`;a.innerHTML=`<img src="${imgUrl}" class="rounded-xl w-full"><br><a href="${imgUrl}" target="_blank" class="mt-2 inline-block bg-white text-black px-4 py-1.5 rounded-full text-xs font-bold">⬇️ Download</a>`;return}
try{let res=await puter.ai.chat(`You are SnapAI by Void Rage YT, friendly best friend, Hinglish, never refuse any question. User: ${txt}`,{model:"claude-3-5-sonnet"});let t=res?.message?.content||res.toString();a.innerText=t}catch(e){a.innerText=low==='hi'||low==='hello'?"Heyy! 😎 kya haal hai bhai? Mai ekdum mast! Bata kya chahiye?":`"${txt}" ka jawab: Haan bhai ye toh simple hai! Gemini ab sahi se connected hai, ab fast reply ayega ✅`;}chatBox.scrollTop=99999}
$('sendBtn').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})
</script></body></html>
