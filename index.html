<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GANGSTER CRIME CITY 6.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
body{background:#000;color:#fff;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}

/* INTRO ANIMATED */
#intro{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#intro.hide{opacity:0;pointer-events:none;transition:1s}
#introBg{position:absolute;inset:0;z-index:0}
#logoWrap{z-index:2;text-align:center;position:relative}
#logo{font-size:52px;letter-spacing:8px;line-height:.9;animation:logoAnim 2s infinite alternate}
@keyframes logoAnim{0%{color:#fff;text-shadow:0 0 10px #8b5cf6,0 0 30px #8b5cf6,0 0 60px #8b5cf6;transform:scale(1) rotate(-1deg)}100%{color:#d8b4fe;text-shadow:0 0 20px #fff,0 0 50px #00d4ff,0 0 100px #8b5cf6;transform:scale(1.05) rotate(1deg)}}
#sub{color:#c4b5fd;font-size:11px;letter-spacing:5px;margin-top:8px;animation:fade 1.5s infinite}
@keyframes fade{0%,100%{opacity:.6}50%{opacity:1}}
#bar{width:340px;height:12px;background:rgba(255,255,255,.08);border-radius:20px;margin-top:22px;overflow:hidden;border:1px solid rgba(139,92,246,.4);z-index:2;position:relative}
#fill{width:0%;height:100%;background:linear-gradient(90deg,#8b5cf6,#00d4ff,#fff,#8b5cf6);background-size:400% 100%;animation:shimmer 1s linear infinite;box-shadow:0 0 20px #8b5cf6}
@keyframes shimmer{0%{background-position:0%}100%{background-position:400%}}
#txt{margin-top:12px;font-size:11px;color:#999;letter-spacing:2px;z-index:2}

#menu{position:fixed;inset:0;background:radial-gradient(circle at 30% 50%,#1a1033,#000);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center}
#menu.show{display:flex}
.btn{width:300px;padding:14px;margin:8px;background:linear-gradient(90deg,#111,#222);border:2px solid #444;border-radius:14px;color:#fff;font-size:14px;cursor:pointer}
.btn:hover{border-color:#8b5cf6;background:#8b5cf6;box-shadow:0 0 20px #8b5cf6}
.btn.main{background:linear-gradient(90deg,#8b5cf6,#00d4ff);border:none;box-shadow:0 0 25px #8b5cf6}
</style></head><body>

<div id="intro">
<canvas id="introBg"></canvas>
<div id="logoWrap">
<div id="logo">GANGSTER<br>CRIME CITY</div>
<div id="sub">VOID RAGE YT PRESENTS</div>
<div id="bar"><div id="fill"></div></div>
<div id="txt">LOADING ULTRA WORLD... 0%</div>
<div style="margin-top:10px;font-size:8px;color:#444;letter-spacing:2px">TAP TO ENABLE SOUND 🔊</div>
</div>
</div>

<div id="menu">
<div style="font-size:48px;text-align:center;line-height:.9;text-shadow:0 0 30px #8b5cf6">GANGSTER<br>CRIME CITY</div>
<div style="color:#8b5cf6;font-size:10px;letter-spacing:4px;margin:10px 0 20px">v6.0 • ANIMATED • NO COPYRIGHT</div>
<button class="btn main" onclick="startGame()">▶ PLAY - ULTRA WORLD</button>
<button class="btn" onclick="startGame()">🔊 SOUND ON + PLAY</button>
</div>

<canvas id="c"></canvas>

<script>
// ===== ANIMATED INTRO BG =====
const ib=document.getElementById('introBg'),ibx=ib.getContext('2d');
function ibRs(){ib.width=innerWidth;ib.height=innerHeight} ibRs();
onresize=()=>{ibRs(); rs();}
let parts=[]; for(let i=0;i<90;i++)parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*3+1,s:Math.random()*1.2+.3,h:260+Math.random()*60});
function ibLoop(){
ibx.fillStyle='rgba(0,0,0,0.3)'; ibx.fillRect(0,0,ib.width,ib.height);
// moving gradient
let g=ibx.createRadialGradient(ib.width/2,ib.height/2,0,ib.width/2,ib.height/2,ib.width);
g.addColorStop(0,'rgba(139,92,246,0.15)'); g.addColorStop(0.5,'rgba(0,212,255,0.08)'); g.addColorStop(1,'rgba(0,0,0,0)');
ibx.fillStyle=g; ibx.fillRect(0,0,ib.width,ib.height);
parts.forEach(p=>{
p.y-=p.s; p.x+=Math.sin(Date.now()*0.001+p.x)*0.6;
if(p.y<0){p.y=ib.height; p.x=Math.random()*ib.width;}
ibx.shadowColor=`hsl(${p.h},100%,70%)`; ibx.shadowBlur=12;
ibx.fillStyle=`hsl(${p.h},100%,70%)`;
ibx.beginPath(); ibx.arc(p.x,p.y,p.r,0,6.28); ibx.fill(); ibx.shadowBlur=0;
});
requestAnimationFrame(ibLoop);
} ibLoop();

// ===== LOADING - NEVER STUCK =====
const fill=document.getElementById('fill'),txt=document.getElementById('txt'),intro=document.getElementById('intro'),menu=document.getElementById('menu');
let load=0; let t=setInterval(()=>{
load+=Math.random()*14+7; if(load>100)load=100;
fill.style.width=load+'%'; txt.innerText=`LOADING ULTRA WORLD... ${Math.floor(load)}%`;
if(load>=100){clearInterval(t); setTimeout(()=>{intro.classList.add('hide'); menu.classList.add('show');},700);}
},120);
// force show after 4.5 sec even if error
setTimeout(()=>{intro.classList.add('hide'); menu.classList.add('show');},4500);

// ===== NO COPYRIGHT SOUND - SELF GENERATED =====
let audioCtx;
function playSound(){
try{
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
// Bass
let o=audioCtx.createOscillator(), g=audioCtx.createGain();
o.type='sawtooth'; o.frequency.value=80;
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);
o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.6);
// Beep
let o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
o2.frequency.value=880; g2.gain.setValueAtTime(0.12,audioCtx.currentTime);
g2.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
o2.connect(g2); g2.connect(audioCtx.destination); o2.start(); o2.stop(audioCtx.currentTime+0.3);
}catch(e){}
}
// Play on any tap
document.addEventListener('click',playSound,{once:true});
document.addEventListener('touchstart',playSound,{once:true});

// ===== GAME START =====
const c=document.getElementById('c'),ctx=c.getContext('2d'); let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight} rs();
function startGame(){playSound(); intro.classList.add('hide'); menu.classList.add('show'); menu.classList.remove('show'); init();}

let player={x:0,y:0}, cam={x:0,y:0}, boats=[]; let sea={x:-4000,y:0,w:6000,h:8000};
function init(){
for(let i=0;i<400;i++)boats.push({x:sea.x+Math.random()*sea.w,y:sea.y+(Math.random()-0.5)*sea.h,a:Math.random()*6.28});
loop();
}
function loop(){
let t=Date.now()*0.001;
// ultra sky
let sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#020211'); sky.addColorStop(.5,'#1a1033'); sky.addColorStop(.7,'#ff7e5f'); sky.addColorStop(1,'#feb47b');
ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
// sea waves
for(let l=0;l<3;l++){
ctx.fillStyle=`rgba(5,${40+l*15},${90+l*18},${0.9-l*0.2})`;
ctx.beginPath();
for(let x=sea.x;x<=sea.x+sea.w;x+=30){let y=sea.y-sea.h/2 + Math.sin(x*0.008+t+l)*12 + l*40; let sx=x+W/2-player.x, sy=y+H/2-player.y;
if(x==sea.x) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);}
ctx.lineTo(sea.x+sea.w+W/2-player.x, sea.y+sea.h/2+H/2-player.y); ctx.lineTo(sea.x+W/2-player.x, sea.y+sea.h/2+H/2-player.y); ctx.closePath(); ctx.fill();
}
boats.forEach(b=>{
let sx=b.x+W/2-player.x, sy=b.y+H/2-player.y;
ctx.save(); ctx.translate(sx,sy); ctx.rotate(b.a); ctx.fillStyle='#5af'; ctx.fillRect(-22,-9,44,18); ctx.restore();
});
ctx.save(); ctx.translate(W/2,H/2); ctx.fillStyle='#8b5cf6'; ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=20; ctx.beginPath(); ctx.arc(0,0,12,0,6.28); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
requestAnimationFrame(loop);
}
</script></body></html>
